<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VxD Score Bug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'MVWaheed';src:url('fonts/MVWaheed.otf') format('opentype')}
  @font-face{font-family:'MvEamaan';src:url('fonts/Mv_Eamaan_XP.otf') format('opentype')}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent}
  body{
    overflow:hidden;width:1920px;height:1080px;
    font-family:'Inter','Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  :root{
    --white:#ffffff;
    --dark:#2b2b2b;
    --ink:#16181c;
    --orange:#ff7a18;
    --green:#16a34a;
    --yellow:#f7c600;
    --red:#ef2b2b;
    --home:#1d4ed8;
    --away:#dc2626;
    --shadow:0 8px 22px rgba(0,0,0,.38);
  }

  /* Condensed numerals for scores and the clock, like the reference */
  .num{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif}

  /* ══ CORNER BUG ══════════════════════════════════════════ */
  .bug{
    position:absolute;top:56px;left:64px;
    display:flex;flex-direction:column;align-items:flex-start;
    transition:opacity .4s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  .bug.hidden{opacity:0;transform:translateX(-40px);pointer-events:none}
  body.pos-tc .bug{left:50%;transform:translateX(-50%);align-items:center}
  body.pos-tc .bug.hidden{transform:translateX(-50%) translateY(-40px)}
  body.pos-bl .bug{top:auto;bottom:210px}

  .bar{
    display:flex;align-items:center;
    width:694px;height:58px;padding:0 9px;
    background:var(--white);border-radius:14px;
    box-shadow:var(--shadow);
  }

  .team{flex:1;display:flex;align-items:center;justify-content:space-between;min-width:0}
  .logo{width:42px;height:42px;flex:0 0 42px;object-fit:contain;display:block}
  .logo.empty{visibility:hidden}
  .tname{
    font-size:25px;font-weight:800;color:var(--ink);
    text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;padding:0 14px;
  }

  /* Stretches past the bar top and bottom — the raised centre block */
  .scorebox{
    position:relative;align-self:stretch;margin:-11px 0;
    flex:0 0 auto;min-width:134px;padding:0 18px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--dark);border-radius:12px;
    box-shadow:0 6px 16px rgba(0,0,0,.34);
  }
  .sc{font-size:46px;font-weight:700;color:#fff;line-height:1;padding-top:2px}
  .dash{font-size:32px;font-weight:600;color:#ffffffcc;line-height:1;padding-top:3px}

  /* Hangs off the bottom of the score box, so it tracks the centre exactly */
  .clockpill{
    position:absolute;top:100%;left:50%;transform:translateX(-50%);
    margin-top:2px;height:40px;min-width:116px;padding:0 15px;
    display:flex;align-items:center;justify-content:center;
    background:var(--orange);border-radius:6px 6px 14px 14px;
    box-shadow:0 6px 14px rgba(0,0,0,.3);
    font-size:27px;font-weight:700;color:#fff;line-height:1;padding-top:3px;
    white-space:nowrap;
  }
  .clockpill.off{display:none}
  .clockpill .stop{font-size:19px;margin-left:3px;color:#fff2}
  .clockpill .stop{color:#ffffffdd}

  /* Cards + fouls, tucked under the bar either side of the clock */
  .statsrow{
    display:grid;grid-template-columns:auto 130px auto;
    justify-content:center;align-items:start;
    width:100%;margin-top:6px;
  }
  .statsrow.hidden{display:none}
  .spill{
    display:flex;align-items:center;gap:7px;height:30px;
    padding:0 12px;background:var(--dark);border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.28);
    font-size:13px;font-weight:800;color:#fff;letter-spacing:.4px;white-space:nowrap;
  }
  .spill.empty{visibility:hidden}
  .spill.left{justify-self:end;margin-right:9px}
  .spill.right{justify-self:start;margin-left:9px}
  /* cap moves to the end on the away side so it sits on the bar's outer edge,
     while the cards/fouls keep the same reading order as the home pill */
  .spill.right .cap{order:1}
  /* Team colour lives here so the white bar stays exactly like the reference */
  .cap{width:5px;height:16px;border-radius:3px;flex:0 0 5px;display:block}
  .card{
    display:flex;align-items:center;justify-content:center;
    min-width:17px;height:21px;border-radius:3px;padding:0 3px;
    font-size:12px;font-weight:900;color:#1a1a1a;line-height:1;
  }
  .card.y{background:var(--yellow)}
  .card.r{background:var(--red);color:#fff}
  .fouls{font-size:13px;font-weight:800;color:#fff}

  /* ══ PENALTY SHOOTOUT ════════════════════════════════════ */
  .pens{
    margin-top:22px;padding:10px 15px 11px;
    background:#f3f3f3;border-radius:10px;box-shadow:var(--shadow);
  }
  .pens.hidden{display:none}
  .pens-hdr{
    font-size:11px;font-weight:900;letter-spacing:1.4px;
    color:var(--ink);text-transform:uppercase;margin-bottom:7px;
  }
  .prow{display:flex;align-items:center;gap:11px;height:22px}
  .pcode{
    font-size:12px;font-weight:900;color:var(--ink);letter-spacing:.6px;
    min-width:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dots{display:flex;gap:7px;align-items:center}
  .dot{width:13px;height:13px;border-radius:50%;background:#cfcfcf;display:block}
  .dot.goal{background:#22c55e}
  .dot.miss{background:var(--red)}

  /* ══ EVENT BANNER ════════════════════════════════════════ */
  .event{
    margin-top:14px;display:flex;align-items:center;
    height:52px;padding:6px;background:var(--dark);
    border-radius:12px;box-shadow:var(--shadow);max-width:840px;
    transition:opacity .3s ease, transform .35s cubic-bezier(.22,1,.36,1);
  }
  .event.hidden{opacity:0;transform:translateX(-26px) scale(.97);pointer-events:none;
                height:0;margin-top:0;padding:0;overflow:hidden}
  .evtype{
    display:flex;align-items:center;height:100%;padding:0 22px;
    border-radius:999px;font-size:21px;font-weight:900;letter-spacing:.6px;
    color:#fff;white-space:nowrap;text-transform:uppercase;
  }
  .evtype.GOAL{background:var(--green)}
  .evtype.YELLOW{background:var(--yellow);color:#1a1a1a}
  .evtype.RED{background:var(--red)}
  .evtype.SUB{background:#2563eb}
  .evtype.INFO{background:#5b6472}
  .evbody{display:flex;align-items:center;gap:16px;padding:0 20px;min-width:0}
  .evtext{
    font-size:24px;font-weight:800;color:#fff;letter-spacing:.4px;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .evsub{font-size:19px;font-weight:900;color:var(--orange);white-space:nowrap;flex:0 0 auto}
  .evsub.empty{display:none}

  /* ══ MAIN CENTRE BOARD ═══════════════════════════════════ */
  .main{
    position:absolute;bottom:112px;left:50%;
    display:flex;align-items:center;
    width:852px;height:68px;padding:0 10px;
    background:var(--white);border-radius:18px;box-shadow:var(--shadow);
    transform:translateX(-50%);
    transition:opacity .45s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  .main.hidden{opacity:0;transform:translateX(-50%) translateY(46px);pointer-events:none}
  .main .logo{width:60px;height:60px;flex:0 0 60px}
  .main .tname{font-size:30px;padding:0 16px}
  .main .scorebox{
    margin:-15px 0;min-width:172px;padding:0 20px;border-radius:13px;
    flex-direction:column;gap:0;justify-content:center;
  }
  .main .mper{
    font-size:15px;font-weight:800;letter-spacing:1.3px;color:#fff;
    text-transform:uppercase;line-height:1;margin-bottom:2px;white-space:nowrap;
  }
  .main .mper.empty{display:none}
  .main .mrow{display:flex;align-items:center;gap:9px}
  .main .sc{font-size:44px}
  .main .dash{font-size:31px}

  /* ══ DHIVEHI / RTL ═══════════════════════════════════════ */
  body.dv .bar,
  body.dv .main,
  body.dv .prow,
  body.dv .event{flex-direction:row-reverse}
  body.dv .team{flex-direction:row-reverse}
  body.dv .bug{align-items:flex-end}
  body.dv .pens{direction:rtl}
  body.dv .spill{flex-direction:row-reverse}
  body.dv .spill.left{justify-self:start;margin-right:0;margin-left:9px}
  body.dv .spill.right{justify-self:end;margin-left:0;margin-right:9px}
  body.dv .tname{
    font-family:'MVWaheed','Segoe UI',Arial,sans-serif;
    text-transform:none;font-weight:400;font-size:28px;
    letter-spacing:0;direction:rtl;padding-top:7px;
  }
  body.dv .main .tname{font-size:33px}
  body.dv .pcode,
  body.dv .fouls,
  body.dv .mper{font-family:'MvEamaan','Segoe UI',Arial,sans-serif;direction:rtl;font-weight:400}
  body.dv .mper{letter-spacing:0;font-size:17px}
  body.dv .pens-hdr{font-family:'MvEamaan','Segoe UI',Arial,sans-serif;letter-spacing:0;font-weight:400;direction:rtl}
  body.dv .evtext{
    font-family:'MVWaheed','Segoe UI',Arial,sans-serif;
    direction:rtl;font-weight:400;text-transform:none;padding-top:7px;
  }
  body.dv .evtype{font-family:'MvEamaan','Segoe UI',Arial,sans-serif;letter-spacing:0;font-weight:400}
  body.dv.pos-tl .bug{left:auto;right:64px}
  body.dv.pos-tl .bug.hidden{transform:translateX(40px)}
  body.dv .event.hidden{transform:translateX(26px) scale(.97)}
</style>
</head>
<body>

  <!-- ── corner bug ── -->
  <div class="bug hidden" id="bug">
    <div class="bar">
      <div class="team home">
        <img class="logo empty" id="lgHome" alt="">
        <span class="tname" id="nmHome">HOME</span>
      </div>

      <div class="scorebox">
        <span class="sc num" id="scHome">0</span>
        <span class="dash num">–</span>
        <span class="sc num" id="scAway">0</span>
        <div class="clockpill num off" id="clockPill">00:00</div>
      </div>

      <div class="team away">
        <span class="tname" id="nmAway">AWAY</span>
        <img class="logo empty" id="lgAway" alt="">
      </div>
    </div>

    <div class="statsrow hidden" id="statsRow">
      <div class="spill left empty" id="spHome"></div>
      <div></div>
      <div class="spill right empty" id="spAway"></div>
    </div>

    <div class="pens hidden" id="penStrip">
      <div class="pens-hdr" id="pensHdr">PENALTY SHOOTOUT</div>
      <div class="prow"><span class="pcode" id="pcHome"></span><span class="dots" id="pdHome"></span></div>
      <div class="prow"><span class="pcode" id="pcAway"></span><span class="dots" id="pdAway"></span></div>
    </div>

    <div class="event hidden" id="evBox">
      <span class="evtype GOAL" id="evType">GOAL</span>
      <div class="evbody">
        <span class="evtext" id="evText"></span>
        <span class="evsub empty" id="evSub"></span>
      </div>
    </div>
  </div>

  <!-- ── main centre board ── -->
  <div class="main hidden" id="mainBoard">
    <div class="team home">
      <img class="logo empty" id="mLgHome" alt="">
      <span class="tname" id="mNmHome">HOME</span>
    </div>

    <div class="scorebox">
      <span class="mper" id="mPer">HALFTIME</span>
      <span class="mrow">
        <span class="sc num" id="mScHome">0</span>
        <span class="dash num">–</span>
        <span class="sc num" id="mScAway">0</span>
      </span>
    </div>

    <div class="team away">
      <span class="tname" id="mNmAway">AWAY</span>
      <img class="logo empty" id="mLgAway" alt="">
    </div>
  </div>

<script>
(() => {
  const P       = new URLSearchParams(location.search);
  const POS     = (P.get('pos') || 'tl').toLowerCase();      // tl | tc | bl
  const PREVIEW = P.get('preview') === '1';
  const ORIGIN  = location.origin;

  document.body.classList.add('pos-' + (['tl','tc','bl'].includes(POS) ? POS : 'tl'));

  const $ = id => document.getElementById(id);
  const el = {
    bug:$('bug'), main:$('mainBoard'),
    lgHome:$('lgHome'), lgAway:$('lgAway'), nmHome:$('nmHome'), nmAway:$('nmAway'),
    scHome:$('scHome'), scAway:$('scAway'), clockPill:$('clockPill'),
    statsRow:$('statsRow'), spHome:$('spHome'), spAway:$('spAway'),
    penStrip:$('penStrip'), pensHdr:$('pensHdr'),
    pcHome:$('pcHome'), pcAway:$('pcAway'), pdHome:$('pdHome'), pdAway:$('pdAway'),
    evBox:$('evBox'), evType:$('evType'), evText:$('evText'), evSub:$('evSub'),
    mLgHome:$('mLgHome'), mLgAway:$('mLgAway'), mNmHome:$('mNmHome'), mNmAway:$('mNmAway'),
    mScHome:$('mScHome'), mScAway:$('mScAway'), mPer:$('mPer')
  };

  // Period definitions: where the displayed clock starts, and where regulation
  // ends (past that we show stoppage as "45:00 +2" like a broadcast clock).
  // `main` is the label the big centre board shows.
  const PERIODS = {
    PRE:  { start:0,   end:null, clock:false, en:'',              dv:'',                  mainEn:'KICK OFF',   mainDv:'ފެށޭ' },
    '1H': { start:0,   end:45,   clock:true,  en:'1ST HALF',      dv:'ފުރަތަމަ ހާފް',      mainEn:'1ST HALF',   mainDv:'ފުރަތަމަ ހާފް' },
    HT:   { start:45,  end:null, clock:true,  en:'HALF TIME',     dv:'ހާފް ޓައިމް',        mainEn:'HALFTIME',   mainDv:'ހާފް ޓައިމް',  frozen:45 },
    '2H': { start:45,  end:90,   clock:true,  en:'2ND HALF',      dv:'ދެވަނަ ހާފް',        mainEn:'2ND HALF',   mainDv:'ދެވަނަ ހާފް' },
    FT:   { start:90,  end:null, clock:true,  en:'FULL TIME',     dv:'ފުލް ޓައިމް',        mainEn:'FULL TIME',  mainDv:'ފުލް ޓައިމް',  frozen:90 },
    ET1:  { start:90,  end:105,  clock:true,  en:'EXTRA TIME 1',  dv:'އިތުރު ވަގުތު 1',   mainEn:'EXTRA TIME', mainDv:'އިތުރު ވަގުތު' },
    ET2:  { start:105, end:120,  clock:true,  en:'EXTRA TIME 2',  dv:'އިތުރު ވަގުތު 2',   mainEn:'EXTRA TIME', mainDv:'އިތުރު ވަގުތު' },
    PENS: { start:0,   end:null, clock:false, en:'PENALTIES',     dv:'ޕެނަލްޓީ',          mainEn:'PENALTIES',  mainDv:'ޕެނަލްޓީ' }
  };

  const PENS_HDR = { en:'PENALTY SHOOTOUT', dv:'ޕެނަލްޓީ ޝޫޓްއައުޓް' };
  const FOULS_LB = { en:'FOULS:',           dv:'ފައުލް:' };
  const EV_LABEL = {
    en:{ GOAL:'GOAL', YELLOW:'YELLOW CARD', RED:'RED CARD', SUB:'SUB', INFO:'INFO' },
    dv:{ GOAL:'ގޯލް', YELLOW:'ރީނދޫ ކާޑު', RED:'ރަތް ކާޑު', SUB:'ބަދަލު', INFO:'މައުލޫމާތު' }
  };

  let state = null, skew = 0, lastKey = '';
  const lastLv = { home:-1, away:-1 };

  const pad = n => String(n).padStart(2,'0');
  const escapeHtml = s => String(s == null ? '' : s)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function clockHtml(){
    if(!state) return '00:00';
    const c = state.clock, def = PERIODS[c.period] || PERIODS['1H'];
    if(def.frozen !== undefined) return pad(def.frozen) + ':00';

    const elapsed = Math.max(0, c.baseMs + (c.running ? (Date.now()+skew) - c.startedAt : 0));
    const total   = def.start*60 + Math.floor(elapsed/1000);

    if(def.end !== null && total >= def.end*60){
      const over = Math.ceil((total - def.end*60)/60) || 1;
      return `${pad(def.end)}:00<span class="stop">+${over}</span>`;
    }
    return pad(Math.floor(total/60)) + ':' + pad(total%60);
  }

  function tickClock(){
    if(!state) return;
    const def = PERIODS[state.clock.period] || PERIODS['1H'];
    el.clockPill.classList.toggle('off', !def.clock);
    if(!def.clock) return;
    const html = clockHtml();
    if(el.clockPill.innerHTML !== html) el.clockPill.innerHTML = html;
  }

  const sideLabel = s => (s.short || s.name || '').trim();

  function renderStats(d){
    let any = false;
    for(const side of ['home','away']){
      const s = d[side];
      const node = side === 'home' ? el.spHome : el.spAway;
      const bits = [`<i class="cap" style="background:${escapeHtml(s.color || '#888')}"></i>`];

      if(d.showCards && s.yellow > 0) bits.push(`<span class="card y">${s.yellow}</span>`);
      if(d.showCards && s.red    > 0) bits.push(`<span class="card r">${s.red}</span>`);
      if(d.showFouls)                 bits.push(`<span class="fouls">${FOULS_LB[d.lang] || FOULS_LB.en} ${s.fouls || 0}</span>`);

      const show = bits.length > 1;
      node.innerHTML = bits.join('');
      node.classList.toggle('empty', !show);
      if(show) any = true;
    }
    el.statsRow.classList.toggle('hidden', !any);
  }

  function renderPens(d){
    const p = d.pens || { visible:false, home:[], away:[] };
    el.penStrip.classList.toggle('hidden', !p.visible);
    if(!p.visible) return;

    el.pensHdr.textContent = PENS_HDR[d.lang] || PENS_HDR.en;
    el.pcHome.textContent  = sideLabel(d.home) || 'HOME';
    el.pcAway.textContent  = sideLabel(d.away) || 'AWAY';

    // Both rows padded to the same length so the columns line up
    const len = Math.max(5, (p.home || []).length, (p.away || []).length);
    const row = arr => Array.from({length:len},
      (_, i) => `<i class="dot ${arr[i] === 'goal' ? 'goal' : arr[i] === 'miss' ? 'miss' : ''}"></i>`).join('');
    el.pdHome.innerHTML = row(p.home || []);
    el.pdAway.innerHTML = row(p.away || []);
  }

  function renderEvent(d){
    const e = d.event || {};
    // Expire locally so the banner clears even if the operator never hides it
    const live = e.visible && !d.mainVisible && (Date.now()+skew) - e.at < e.dur*1000;
    el.evBox.classList.toggle('hidden', !live);
    if(!live) return;

    const type = ['GOAL','YELLOW','RED','SUB','INFO'].includes(e.type) ? e.type : 'INFO';
    el.evType.className   = 'evtype ' + type;
    el.evType.textContent = (EV_LABEL[d.lang] || EV_LABEL.en)[type] || type;
    el.evText.textContent = e.text || '';
    el.evSub.textContent  = e.sub || '';
    el.evSub.classList.toggle('empty', !e.sub);
  }

  async function loadLogo(side){
    try{
      const r = await fetch(`${ORIGIN}/api/score/logo/${side}`, { cache:'no-store' });
      if(!r.ok) return;
      const d = await r.json();
      const imgs = side === 'home' ? [el.lgHome, el.mLgHome] : [el.lgAway, el.mLgAway];
      for(const img of imgs){
        if(d.logo){ img.src = d.logo; img.classList.remove('empty'); }
        else      { img.removeAttribute('src'); img.classList.add('empty'); }
      }
    }catch(e){}
  }

  function render(d){
    document.body.classList.toggle('dv', d.lang === 'dv');

    const hName = d.home.name || d.home.short || 'HOME';
    const aName = d.away.name || d.away.short || 'AWAY';
    el.nmHome.textContent  = hName;  el.mNmHome.textContent = hName;
    el.nmAway.textContent  = aName;  el.mNmAway.textContent = aName;
    el.scHome.textContent  = d.home.score ?? 0;
    el.scAway.textContent  = d.away.score ?? 0;
    el.mScHome.textContent = d.home.score ?? 0;
    el.mScAway.textContent = d.away.score ?? 0;

    const def = PERIODS[d.clock.period] || PERIODS['1H'];
    const mainLbl = d.lang === 'dv' ? def.mainDv : def.mainEn;
    el.mPer.textContent = mainLbl || '';
    el.mPer.classList.toggle('empty', !mainLbl);

    renderStats(d);
    renderPens(d);

    // Main board takes the screen: the corner bug and everything under it goes away
    el.main.classList.toggle('hidden', !d.mainVisible);
    el.bug.classList.toggle('hidden', !d.visible || d.mainVisible);
  }

  async function poll(){
    try{
      const r = await fetch(`${ORIGIN}/api/score?t=${Date.now()}`, { cache:'no-store' });
      if(!r.ok) return;
      const d = await r.json();

      skew  = (d.serverNow || Date.now()) - Date.now();
      state = d;

      for(const side of ['home','away']){
        if((d[side].lv || 0) !== lastLv[side]){ lastLv[side] = d[side].lv || 0; loadLogo(side); }
      }

      // Cheap diff so we're not rewriting the DOM 60 times a minute for nothing.
      // The event is excluded — it's time-sensitive and handled every tick.
      const key = JSON.stringify([
        d.visible, d.mainVisible, d.lang, d.showCards, d.showFouls,
        d.home.name, d.home.short, d.home.color, d.home.score, d.home.yellow, d.home.red, d.home.fouls,
        d.away.name, d.away.short, d.away.color, d.away.score, d.away.yellow, d.away.red, d.away.fouls,
        d.clock.period, d.pens
      ]);
      if(key !== lastKey){ lastKey = key; render(d); }

      renderEvent(d);
      tickClock();
    }catch(e){}
  }

  if(PREVIEW){
    // Static sample so the layout can be eyeballed without touching live state
    state = {
      visible:true, mainVisible:false, lang:'en', showCards:true, showFouls:true,
      home:{ name:'INGURAIDHOO', short:'ING', color:'#e11d48', score:0, yellow:3, red:1, fouls:3, lv:0 },
      away:{ name:'INGURAIDHOO', short:'ING', color:'#0ea5e9', score:0, yellow:3, red:0, fouls:3, lv:0 },
      clock:{ running:false, baseMs:12*60000, startedAt:0, period:'1H' },
      pens:{ visible:true, home:['goal','goal','miss','goal','miss'], away:['miss','miss','goal','goal','goal'] },
      event:{ visible:false }
    };
    render(state);
    tickClock();
  }else{
    poll();
    setInterval(poll, 1000);
    setInterval(tickClock, 200);   // smooth seconds between polls
  }
})();
</script>
</body>
</html>
