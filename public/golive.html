<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Go Live — VxD</title>
<style>
:root{
  --bg:#09090b;--card:#18181b;--card2:#1f1f23;--bdr:#27272a;--bdr2:#3f3f46;
  --t1:#fafafa;--t2:#a1a1aa;--t3:#71717a;
  --red:#ef4444;--grn:#22c55e;--blu:#3b82f6;--amb:#f59e0b;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 28px);
  max-width:620px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
[hidden]{display:none!important}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand .v{color:var(--red)}.brand .x{color:var(--amb)}.brand .d{color:var(--grn)}
.conn{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.8px;
  padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--t3);border:1px solid transparent}
.conn.on{background:#22c55e12;border-color:#22c55e30;color:var(--grn)}
.conn.off{background:#ef444412;border-color:#ef444430;color:var(--red)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* PSM preview */
.preview{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--bdr);
  border-radius:14px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center}
.preview video{width:100%;height:100%;object-fit:contain;display:none;background:#000}
.preview.on video{display:block}
.p-off{color:var(--t3);font-size:12px;font-weight:600;letter-spacing:.5px;text-align:center;padding:0 16px}
.preview.on .p-off{display:none}
.p-badge{position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;letter-spacing:.8px;
  padding:4px 9px;border-radius:999px;background:#00000090;backdrop-filter:blur(6px);
  color:var(--t3);border:1px solid var(--bdr)}
.preview.on .p-badge{color:var(--grn);border-color:#22c55e40}
.p-mute{position:absolute;bottom:10px;right:10px;font-size:15px;line-height:1;padding:8px 10px;
  border-radius:999px;background:#00000090;backdrop-filter:blur(6px);border:1px solid var(--bdr);color:var(--t2)}

/* status banner */
.banner{border-radius:16px;padding:20px 18px;margin-bottom:16px;border:1px solid var(--bdr);
  background:var(--card);text-align:center;transition:all .25s}
.banner.live{border-color:#ef444440;background:linear-gradient(180deg,#1a0c0c 0%,var(--card) 100%)}
.banner.reh{border-color:#f59e0b40;background:linear-gradient(180deg,#1a150a 0%,var(--card) 100%)}
.b-state{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.banner.live .b-state{color:var(--red)}
.banner.reh .b-state{color:var(--amb)}
.banner .b-state{color:var(--t3)}
.b-sub{font-size:12px;color:var(--t3);min-height:17px;word-break:break-word}
.b-clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--t2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.banner.live .b-state{animation:pulse 2s infinite}

/* input */
.lbl{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);
  margin:0 0 8px 2px}
input[type=text]{width:100%;padding:15px 16px;background:var(--card);border:1px solid var(--bdr);
  border-radius:12px;color:var(--t1);font-size:16px;font-family:inherit;outline:none;margin-bottom:18px}
input[type=text]:focus{border-color:var(--bdr2)}
input[type=text]::placeholder{color:var(--t3)}
input:disabled{opacity:.5}
textarea{width:100%;padding:13px 16px;background:var(--card);border:1px solid var(--bdr);
  border-radius:12px;color:var(--t1);font-size:16px;font-family:inherit;outline:none;
  margin-bottom:18px;resize:vertical;min-height:84px;line-height:1.5}
textarea:focus{border-color:var(--bdr2)}
textarea::placeholder{color:var(--t3)}
.found-hdr{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--amb);margin:0 0 8px 2px}

/* destinations */
.dests{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.dest{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;background:var(--card);border:1px solid var(--bdr);border-radius:12px}
.d-name{font-size:14px;font-weight:700;letter-spacing:.2px}
.d-note{font-size:11px;color:var(--t3);margin-top:2px}
.d-note a{color:var(--t2);text-decoration:underline;text-underline-offset:2px}
.pill{flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;padding:7px 12px;border-radius:999px;
  background:var(--card2);color:var(--t3);border:1px solid transparent;white-space:nowrap}
.pill.on{background:#22c55e12;border-color:#22c55e30;color:var(--grn)}
.pill.warn{background:#f59e0b12;border-color:#f59e0b30;color:var(--amb)}
.pill.err{background:#ef444412;border-color:#ef444430;color:var(--red)}
button.pill{min-height:34px}
/* destination picker — deliberately NOT green. Green on this page means
   "on air"; a selected-but-not-started destination is neither. */
.pill.pick{background:#f2f0ec14;border-color:#f2f0ec30;color:var(--t1)}
.dest.unpicked{opacity:.45}
.dest.unpicked .pill{background:transparent;border-color:var(--bdr)}
.sel-note{margin:-12px 0 18px 2px;font-size:12px;font-weight:600;color:var(--amb)}
.sel-note.calm{color:var(--t3);font-weight:500}

/* actions */
.btn{width:100%;padding:18px;border-radius:14px;font-size:15px;font-weight:800;letter-spacing:.6px;
  color:#fff;transition:all .15s;min-height:56px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.go{background:var(--red);margin-bottom:8px}
.btn.go.arm{background:#fff;color:#0a0a0a}
.btn.reh{background:var(--card2);color:var(--t2);border:1px solid var(--bdr)}
.btn.end{background:#dc2626;margin-bottom:8px}
.btn.end.arm{background:#fff;color:#0a0a0a}
.row{display:flex;gap:8px}
.row .btn{margin-bottom:0}

/* message + preflight */
.msg{margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--t3);white-space:pre-line;
  word-break:break-word;min-height:18px}
.msg.ok{color:var(--grn)}.msg.err{color:var(--red)}.msg.warn{color:var(--amb)}
.tools{margin-top:22px;padding-top:18px;border-top:1px solid var(--bdr);
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.link{background:none;color:var(--t3);font-size:11px;font-weight:700;letter-spacing:.8px;
  padding:8px 12px;border-radius:8px;text-decoration:none;display:inline-block}
.link:hover,.link:active{color:var(--t1);background:var(--card)}
</style>
<!-- PIN gate. Loaded first so its fetch wrapper is in place before any page code runs. -->
<script src="/authgate.js"></script>
</head>
<body>

<div class="hdr">
  <div class="brand"><span class="v">V</span><span class="x">x</span><span class="d">D</span> Go Live</div>
  <div class="conn off" id="conn"><span class="dot"></span><span id="connTxt">OFFLINE</span></div>
</div>

<div class="preview" id="preview">
  <video id="psmVid" muted autoplay playsinline></video>
  <div class="p-off" id="psmOff">PROGRAM — waiting for feed</div>
  <div class="p-badge" id="psmBadge">PROGRAM</div>
  <button class="p-mute" id="psmMute" onclick="toggleMute()" title="Unmute">🔇</button>
</div>

<div class="banner" id="banner">
  <div class="b-state" id="state">IDLE</div>
  <div class="b-sub" id="sub">Nothing is broadcasting</div>
</div>

<div id="titleWrap">
  <div class="lbl">Event name</div>
  <input type="text" id="title" dir="auto" autocomplete="off"
         placeholder="Maziya vs New Radiant — Dhivehi Premier League">
  <div class="lbl">Post caption <span style="text-transform:none;letter-spacing:0;font-weight:500">— optional, falls back to the event name</span></div>
  <textarea id="caption" dir="auto"
            placeholder="A line or two of context — reads better than a bare title."></textarea>
</div>

<div class="dests" id="dests"></div>
<div class="sel-note" id="selNote" hidden></div>

<button class="btn go" id="go" onclick="tapGo()">GO LIVE</button>
<button class="btn end" id="end" onclick="tapEnd()" hidden>END LIVE</button>
<button class="btn end" id="stopman" onclick="tapStopManual()" hidden>STOP MANUAL STREAM</button>
<div class="row"><button class="btn reh" id="reh" onclick="tapReh()">REHEARSE</button></div>

<div id="foundWrap" hidden>
  <div class="found-hdr">Still live on these pages</div>
  <div class="dests" id="found"></div>
  <button class="btn end" id="endfound" onclick="tapEndFound()">END THESE BROADCASTS</button>
</div>

<div class="msg" id="msg"></div>

<div class="tools">
  <button class="link" onclick="preflight()">RUN PREFLIGHT</button>
  <button class="link" onclick="scanLive()">SCAN FOR OPEN LIVES</button>
  <a class="link" href="/">CONTROL PANEL</a>
  <a class="link" href="/live">STREAM PREVIEW</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
// ============================================================
// GO LIVE — mobile-first front end for the event automation.
//
// Facebook is API-driven: one title creates a broadcast on the
// selected pages and the relay publishes them once ingest is
// confirmed. YouTube rides a persistent stream key bound to a
// per-event broadcast.
//
// DESTINATIONS: the three rows are pickable while idle. Tap a row
// to drop it from the next event — DHUVAS-only and YouTube-only
// are real configurations, not a degraded mode: VOICE is the main
// encoder output while the other two are Branch Output filters,
// and under Interlock "Always ON" a branch broadcasts on its own.
//
// NOTHING is selected by default. The page opens with all three OFF
// and GO LIVE refused until at least one is tapped, and it returns to
// that state after every END LIVE. Two taps before every event is a
// small price: it means a destination is never on air because it was
// on air last time, and the set going out is always one somebody
// looked at and chose.
//
// Destructive actions use tap-to-arm rather than confirm(), which
// is unreliable and ugly on phones, and easy to dismiss by reflex.
// ============================================================
let M={live:false,rehearsal:false,videos:{},dests:null,title:'',startedAt:0,lastError:''};
let connected=false, streaming=false, ytLive=false, dhLive=false;
let armed=null, armTimer=null;

// Next event's destinations. Nothing is picked until somebody picks it.
// ALL_DESTS remains only as the reading for a RUNNING event whose relay
// reported no `dests` field — an older build, where all three was the
// only behaviour there was.
const ALL_DESTS={voice:true,dhuvas:true,youtube:true};
const NO_DESTS={voice:false,dhuvas:false,youtube:false};
let sel=Object.assign({},NO_DESTS);
const DEST_LABEL={voice:'VOICE',dhuvas:'DHUVAS',youtube:'YOUTUBE'};
function selList(d){ return ['voice','dhuvas','youtube'].filter(k=>d[k]).map(k=>DEST_LABEL[k]); }
function selText(d){
  const n=selList(d);
  if(!n.length) return 'nothing';
  if(n.length===1) return n[0];
  return n.slice(0,-1).join(', ')+' and '+n[n.length-1];
}

async function api(path,body){
  try{
    const opt = body===undefined ? {}
      : {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
    const r=await fetch(path,opt);
    let d={}; try{ d=await r.json(); }catch(_){}
    return {ok:r.ok,data:d};
  }catch(e){ return {ok:false,data:{error:e.message}}; }
}

function msg(t,cls){
  const e=document.getElementById('msg');
  e.className='msg'+(cls?' '+cls:''); e.textContent=t||'';
}

function clock(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=n=>String(n).padStart(2,'0');
  return (h?h+':':'')+p(m)+':'+p(x);
}

// Disarm a pending confirmation — any state change or timeout cancels it,
// so a stale armed button can never fire against a changed situation.
const ARM_SECONDS=6;
const BTN_LABEL={go:'GO LIVE',end:'END LIVE',stopman:'STOP MANUAL STREAM',endfound:'END THESE BROADCASTS'};
function disarm(){
  if(armTimer){clearInterval(armTimer);armTimer=null;}
  if(armed){
    const b=document.getElementById(armed);
    if(b){b.classList.remove('arm');b.textContent=BTN_LABEL[armed]||'';}
    armed=null;
  }
}
// Two-tap confirm with a visible countdown. A silent window leaves you
// guessing whether you still have time; the number removes the guess.
function arm(id,label,then){
  if(armed===id){ disarm(); then(); return; }
  disarm(); armed=id;
  const b=document.getElementById(id);
  b.classList.add('arm');
  let left=ARM_SECONDS;
  const paint=()=>{ b.textContent=label+'  '+left; };
  paint();
  armTimer=setInterval(()=>{ if(--left<=0) disarm(); else paint(); },1000);
}

function render(){
  const c=document.getElementById('conn');
  c.className='conn '+(connected?'on':'off');
  document.getElementById('connTxt').textContent=connected?'OBS CONNECTED':'OBS OFFLINE';

  const ban=document.getElementById('banner');
  const st=document.getElementById('state');
  const sub=document.getElementById('sub');

  // Which destinations a running event uses belongs in the banner, not
  // only in the rows: it is the one line you look at to know what is out
  // there. Omitted when all three are up — that is the expected case and
  // saying so every time would train the eye to skip the line.
  const liveDests=M.live&&M.dests&&selList(M.dests).length<3
    ? selText(M.dests)+' only · ' : '';

  if(M.live&&M.rehearsal){
    ban.className='banner reh'; st.textContent='REHEARSAL';
    sub.innerHTML=esc(liveDests)+'Nothing is public · <span class="b-clock">'+clock(Date.now()-M.startedAt)+'</span>';
  }else if(M.live){
    ban.className='banner live'; st.textContent='● LIVE';
    sub.innerHTML=esc(liveDests)+(M.title?esc(M.title)+' · ':'')+'<span class="b-clock">'+clock(Date.now()-M.startedAt)+'</span>';
  }else{
    ban.className='banner'; st.textContent='IDLE';
    sub.textContent = streaming ? 'OBS is streaming outside event control'
                                : 'Nothing is broadcasting';
  }

  // OBS streaming with no event of ours running = someone started it by
  // hand (persistent keys, Live Producer). We can't end those broadcasts —
  // they aren't ours — but we can stop the encoder and disarm the branches.
  const manual = streaming && !M.live;
  const busy = M.live || streaming;
  // Nothing is selected by default, so both buttons start disabled. The
  // amber note directly above them says why — a dead button with no
  // explanation is the one thing worse than an extra tap.
  const nPicked = ['voice','dhuvas','youtube'].filter(k=>sel[k]).length;
  document.getElementById('go').disabled  = busy || !connected || !nPicked;
  document.getElementById('reh').disabled = busy || !connected || !nPicked;
  document.getElementById('go').hidden    = M.live || manual;
  document.getElementById('reh').hidden   = M.live || manual;
  document.getElementById('end').hidden   = !M.live;
  document.getElementById('stopman').hidden = !manual;
  // Once live the title is fixed and already shown in the banner — an
  // empty disabled field just looks broken.
  document.getElementById('titleWrap').hidden = M.live;

  // Which destinations the RUNNING event chose. An older relay (or an
  // event started before this field existed) reports nothing, in which
  // case the historical behaviour — all three — is the honest reading.
  const D = M.live ? (M.dests || ALL_DESTS) : sel;

  const row=(k,note,pill)=>
    '<div class="dest'+(D[k]?'':' unpicked')+'"><div><div class="d-name">'+DEST_LABEL[k]+'</div>'+
    '<div class="d-note">'+note+'</div></div>'+pill+'</div>';

  // A Facebook row. Idle → a picker. Live → what the broadcast is doing.
  const fb=(k)=>{
    const v=M.videos&&M.videos[k];
    let cls='',txt='READY';
    if(!M.live&&!manual){
      // Same alarm the YouTube row has always had. Under Always ON an
      // enabled DHUVAS branch is on air right now, event or no event —
      // that outranks showing a picker for the next one.
      if(k==='dhuvas'&&dhLive){
        return row(k,'Facebook · branch armed with no event running',
          '<button class="pill err" onclick="disarmDhuvas()">ARMED — PUSHING!</button>');
      }
      cls=D[k]?'pick':''; txt=D[k]?'ON':'OFF';
      return row(k,'Facebook · tap to include or drop',
        '<button class="pill '+cls+'" onclick="pickDest(\''+k+'\')">'+txt+'</button>');
    }
    if(!D[k]) return row(k,'Facebook · not part of this event','<span class="pill">NOT IN THIS EVENT</span>');
    if(v&&v.published){cls='on';txt='● LIVE';}
    else if(v){cls='warn';txt='UNPUBLISHED';}
    return row(k,'Facebook · title from this page','<span class="pill '+cls+'">'+txt+'</span>');
  };

  // Interlock is Always ON, so an armed branch is BROADCASTING, not merely
  // ready. Off between events is the correct state, so it reads neutral;
  // armed outside an event is an alarm, not a reassurance — and the alarm
  // outranks the picker, because a branch pushing right now is the more
  // urgent fact than what the next event will use.
  let ytCls,ytTxt,ytAction='toggleYt()';
  if(M.live&&!D.youtube){ ytCls=ytLive?'err':''; ytTxt=ytLive?'PUSHING — NOT IN THIS EVENT!':'NOT IN THIS EVENT'; }
  else if(M.live&&!M.rehearsal){ ytCls=ytLive?'on':'warn'; ytTxt=ytLive?'● LIVE':'OFF — NOT GOING OUT'; }
  else if(M.live&&M.rehearsal){ ytCls=ytLive?'err':''; ytTxt=ytLive?'PUSHING!':'OFF'; }
  else if(manual){ ytCls=ytLive?'warn':''; ytTxt=ytLive?'● LIVE (manual)':'OFF'; }
  else if(ytLive){ ytCls='err'; ytTxt='ARMED — PUSHING!'; }
  else { ytCls=D.youtube?'pick':''; ytTxt=D.youtube?'ON':'OFF'; ytAction="pickDest('youtube')"; }

  // Once the relay creates the broadcast itself, the note becomes a link
  // to it — the fastest way to confirm the title actually landed.
  const ytNote = M.youtube
    ? '<a href="'+M.youtube.url+'" target="_blank" rel="noopener">'+esc(M.youtube.title)+' ↗</a>'
    : (!M.live&&!manual&&!ytLive ? 'Persistent key · tap to include or drop'
                                 : 'Persistent key · bound per event');

  document.getElementById('dests').innerHTML =
    fb('voice') + fb('dhuvas') +
    row('youtube',ytNote,'<button class="pill '+ytCls+'" onclick="'+ytAction+'">'+ytTxt+'</button>');

  // What is about to go out, said once and plainly above the button —
  // not discovered afterwards in the Facebook feed. Shown for every
  // selection, including the full house: with nothing picked by default,
  // all three is a choice somebody made and deserves confirming too.
  const note=document.getElementById('selNote');
  if(M.live||manual){ note.hidden=true; }
  else {
    note.hidden=false;
    // Amber for a partial or empty selection, plain for the full house —
    // colouring the ordinary case as a warning is how a warning stops
    // being read.
    note.className='sel-note'+(nPicked===3?' calm':'');
    note.textContent = nPicked
      ? 'This event goes to '+selText(sel)+'.'
      : 'No destination selected — tap a row above to pick at least one.';
  }
}

// A destination can be dropped only while idle: mid-event the rows are a
// readout, and dhuvas cannot be added to a running event anyway (its key
// is written before StartStream).
function pickDest(k){
  if(M.live||(streaming&&!M.live)) return;
  sel[k]=!sel[k];
  disarm();                     // the armed confirmation named the old set
  render();
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function poll(){
  const [a,b]=await Promise.all([api('/api/match/status'),api('/api/obs')]);
  if(a.ok&&a.data) M=a.data;
  if(b.ok&&b.data){ connected=!!b.data.connected; streaming=!!b.data.streaming;
                    ytLive=!!b.data.ytLive; dhLive=!!b.data.branchLive; }
  else connected=false;
  render();
}

function titleVal(){ return (document.getElementById('title').value||'').trim(); }
function captionVal(){ return (document.getElementById('caption').value||'').trim(); }

function tapGo(){
  const t=titleVal();
  if(!t){ msg('Enter an event name first — it becomes the post title on the selected pages.','err'); return; }
  if(!selList(sel).length){ msg('Pick at least one destination — tap a row above.','err'); return; }
  arm('go','TAP AGAIN TO GO LIVE',()=>goLive(t));
  // Name the destinations in the confirmation, not just "for real". This is
  // the last screen before it is public, and it is the only place the
  // difference between all three and one is unmissable.
  if(armed) msg('This publishes to '+selText(sel)+' for real.','warn');
}

async function goLive(t){
  const picked=Object.assign({},sel);
  msg('Creating broadcasts for '+selText(picked)+'…');
  const r=await api('/api/match/start',{title:t,description:captionVal(),destinations:picked});
  if(!r.ok){ msg('Failed: '+(r.data.error||'unknown error'),'err'); }
  else{
    const on=Object.keys(r.data.videos||{}).filter(k=>r.data.videos[k]).map(k=>DEST_LABEL[k]);
    if(picked.youtube) on.push('YOUTUBE');
    msg('Live on '+(on.join(' + ')||'nothing')+'. Publishing in ~10s once ingest is confirmed.','ok');
    setTimeout(poll,12000);
  }
  poll();
}

// Rehearsal publishes nothing, so it needs no confirmation — but it must
// cancel any armed GO LIVE, or an armed button could fire afterwards.
function tapReh(){ disarm(); rehearse(); }

async function rehearse(){
  const t=titleVal()||'Rehearsal - not for broadcast';
  if(!selList(sel).length){ msg('Pick at least one destination — tap a row above.','err'); return; }
  if(ytLive){
    msg('Disarming YouTube first — rehearsal only protects Facebook…','warn');
    await api('/api/obs/branch',{target:'youtube',enabled:false});
    await new Promise(r=>setTimeout(r,700));
    await poll();
    if(ytLive){ msg('Could not disarm YouTube. Aborted — nothing was started.','err'); return; }
  }
  const r=await api('/api/match/start',
    {title:t,publish:false,description:captionVal(),destinations:Object.assign({},sel)});
  if(!r.ok) msg('Failed: '+(r.data.error||'unknown error'),'err');
  else msg('Rehearsal running on '+selText(sel)+'. Nothing is public and no VOD is left behind.','warn');
  poll();
}

function tapEnd(){
  arm('end','TAP AGAIN TO END LIVE',endMatch);
  if(armed){
    const d=M.dests||ALL_DESTS;
    msg('This closes '+selText(d)+' and disarms every branch.'+
        (d.voice?' The OBS encoder stops too.':' The OBS encoder was never started.'),'warn');
  }
}

async function endMatch(){
  msg('Ending…');
  const r=await api('/api/match/end',{});
  const errs=(r.data&&r.data.errors)||[];
  msg(errs.length?('Ended with problems:\n'+errs.join('\n')):'Ended cleanly.',errs.length?'err':'ok');
  // Back to nothing picked. Last event's selection must never become the
  // silent default for whatever runs next.
  sel=Object.assign({},NO_DESTS);
  await poll();
  if(ytLive||dhLive) setTimeout(()=>msg('Ended, but a branch is still ARMED and pushing. Tap the pill to stop it.','err'),1600);
}

function tapStopManual(){
  arm('stopman','TAP AGAIN TO STOP',stopManual);
  if(armed) msg('Stops the OBS encoder and disarms both branches.\nBroadcasts started by hand must still be ended on Facebook / YouTube.','warn');
}

async function stopManual(){
  msg('Disarming branches and stopping the encoder…');
  // Disarm first: under Always ON the branches do NOT stop with the main
  // stream, so stopping in the other order leaves them pushing.
  await api('/api/obs/branch',{target:'youtube',enabled:false});
  await api('/api/obs/branch',{target:'dhuvas',enabled:false});
  const r=await api('/api/obs/stream',{action:'stop'});
  await new Promise(x=>setTimeout(x,900));
  await poll();
  if(!r.ok) msg('Stop failed: '+(r.data.error||'unknown error'),'err');
  else if(streaming) msg('Branches disarmed, but OBS is still streaming. Stop it in OBS.','err');
  else { msg('Encoder stopped and branches disarmed. Checking for open broadcasts…','ok'); await scanLive(); }
}

async function toggleYt(){
  const next=!ytLive;
  msg(next?'Arming YouTube…':'Disarming YouTube…');
  await api('/api/obs/branch',{target:'youtube',enabled:next});
  setTimeout(async()=>{ await poll(); msg(ytLive?'YouTube armed.':'YouTube disarmed.',ytLive?'ok':'warn'); },700);
}

// The DHUVAS equivalent, reachable only from the ARMED alarm state — there
// is no reason to arm it by hand, and every reason to be able to stop it.
async function disarmDhuvas(){
  msg('Disarming DHUVAS…');
  await api('/api/obs/branch',{target:'dhuvas',enabled:false});
  setTimeout(async()=>{ await poll(); msg(dhLive?'DHUVAS is STILL armed — check OBS.':'DHUVAS disarmed.',dhLive?'err':'warn'); },700);
}

// ---- broadcasts still open on the pages ----
// Anything the relay did not create — Live Producer, a persistent key, a
// colleague, or our own event from before a relay restart. Found is not
// the same as ours, so nothing is ended without an explicit second tap.
let foundVideos=[];

function renderFound(){
  const wrap=document.getElementById('foundWrap');
  const box=document.getElementById('found');
  if(!foundVideos.length){ wrap.hidden=true; box.innerHTML=''; return; }
  box.innerHTML=foundVideos.map(v=>{
    const when=v.creation_time?new Date(v.creation_time).toLocaleTimeString():'';
    return '<div class="dest"><div><div class="d-name">'+esc(v.label)+
      (v.ours?' <span style="color:var(--t3);font-weight:500">· started here</span>':'')+
      '</div><div class="d-note">'+esc(v.title)+(when?' · '+when:'')+'</div></div>'+
      '<span class="pill '+(v.status==='LIVE'?'err':'warn')+'">'+v.status+'</span></div>';
  }).join('');
  wrap.hidden=false;
}

async function scanLive(quiet){
  if(!quiet) msg('Scanning both pages…');
  const r=await api('/api/live/scan');
  const list=(r.data&&r.data.videos)||[];
  const errs=list.filter(v=>v.error);
  foundVideos=list.filter(v=>v.id);
  renderFound();
  if(quiet) return;
  if(errs.length) msg('Scan errors:\n'+errs.map(e=>e.label+': '+e.error).join('\n'),'err');
  else if(!foundVideos.length) msg('No published broadcast open on either page.\n(Rehearsals stay unpublished and Facebook does not list them — that is expected.)','ok');
  else msg(foundVideos.length+' broadcast(s) still open — listed below.','warn');
}

function tapEndFound(){
  arm('endfound','TAP AGAIN TO END THEM',endFound);
  if(armed) msg('Ends every broadcast listed below, including any a colleague started.','warn');
}

async function endFound(){
  msg('Ending '+foundVideos.length+' broadcast(s)…');
  const r=await api('/api/live/end',{videos:foundVideos.map(v=>({brand:v.brand,id:v.id}))});
  const errs=(r.data&&r.data.errors)||[];
  await scanLive(true);
  msg(errs.length?('Some could not be ended:\n'+errs.join('\n')):'All ended.',errs.length?'err':'ok');
}

async function preflight(){
  msg('Checking tokens and OBS…');
  const r=await api('/api/match/check');
  const d=r.data||{};
  const out=[];
  if(d.obs) out.push('OBS: '+(d.obs.connected?'connected':'NOT CONNECTED')+(d.obs.streaming?' · already streaming':''));
  for(const [k,p] of Object.entries(d.pages||{})){
    if(p.skipped){ out.push(k.toUpperCase()+': not configured (stays manual)'); continue; }
    out.push(k.toUpperCase()+': '+(p.ok?'ok':'FAIL '+(p.error||''))+
      (p.dataAccessDays!=null?' · data access '+p.dataAccessDays+'d ('+p.dataAccessExpires+')':''));
  }
  // The server now judges branch state for us — armed outside an event is
  // a failure there, so don't second-guess it here.
  if(d.branches) out.push('Branches: dhuvas '+(d.branches.dhuvas?'ARMED':'off')+
                          ', youtube '+(d.branches.youtube?'ARMED':'off'));
  if(d.youtube) out.push('YouTube API: '+(d.youtube.configured
      ? (d.youtube.token==='ok'
          ? 'ok · '+d.youtube.privacy+' · ingest '+
            (d.youtube.streamId==='MISSING' ? 'MISSING' : 'ok')
          : 'TOKEN FAILED')
      : 'not configured'));
  (d.warnings||[]).forEach(w=>out.push('⚠ '+w));
  msg(out.join('\n'), d.ok?'ok':'err');
}

// ---------------- PROGRAM monitor preview ----------------
// The relay serves /hls/program.m3u8 only while something is publishing to
// rtmp://.../live/program, and 404s otherwise. So probe the manifest rather
// than letting hls.js retry-storm against a feed that isn't there yet,
// and tear the player down when the feed stops so the poster returns.
let hls=null, psmUp=false;

function psmStop(){
  if(hls){ try{hls.destroy();}catch(_){ } hls=null; }
  psmUp=false;
  document.getElementById('preview').classList.remove('on');
  document.getElementById('psmBadge').textContent='PROGRAM';
}

function psmStart(){
  const v=document.getElementById('psmVid');
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({liveSyncDuration:6,liveMaxLatencyDuration:20,maxBufferLength:12,
                 manifestLoadingMaxRetry:4,levelLoadingMaxRetry:4,fragLoadingMaxRetry:4});
    hls.loadSource('/hls/program.m3u8');
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); return; }
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); return; }
      psmStop();
    });
  }else{
    // Safari plays HLS natively and has no Hls.isSupported() path.
    v.src='/hls/program.m3u8'; v.play().catch(()=>{});
  }
  psmUp=true;
  document.getElementById('preview').classList.add('on');
  document.getElementById('psmBadge').textContent='● ON AIR';
}

async function psmPoll(){
  let live=false;
  try{
    const r=await fetch('/hls/program.m3u8',{cache:'no-store'});
    // A 200 is not enough — a proxy error page or SPA fallback also
    // returns 200. Only a real manifest starts with #EXTM3U.
    if(r.ok) live=(await r.text()).trimStart().startsWith('#EXTM3U');
  }catch(_){ live=false; }
  if(live&&!psmUp) psmStart();
  else if(!live&&psmUp){ psmStop(); document.getElementById('psmOff').textContent='PROGRAM — feed stopped'; }
}

function toggleMute(){
  const v=document.getElementById('psmVid');
  v.muted=!v.muted;
  document.getElementById('psmMute').textContent=v.muted?'🔇':'🔊';
  if(!v.muted) v.play().catch(()=>{});
}

// A running clock needs a faster tick than the 3s poll, but only the
// clock — no network. Keeps the elapsed time honest without extra load.
poll(); setInterval(poll,3000); setInterval(()=>{ if(M.live) render(); },1000);
psmPoll(); setInterval(psmPoll,5000);
document.getElementById('title').addEventListener('input',disarm);
</script>
